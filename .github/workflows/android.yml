name: Build and release Android app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/build.gradle.kts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: Check version change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || "$REF_TYPE" == tag ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import re
          import subprocess

          def version(ref):
              source = subprocess.check_output(
                  ['git', 'show', f'{ref}:app/build.gradle.kts'], text=True
              )
              values = []
              for field, pattern in (
                  ('versionName', r'^\s*versionName\s*=\s*"([^"\n]+)"'),
                  ('versionCode', r'^\s*versionCode\s*=\s*(\d+)\b'),
              ):
                  matches = re.findall(pattern, source, re.MULTILINE)
                  if len(matches) != 1:
                      raise ValueError(f'Expected one literal {field} in {ref}')
                  values.append(matches[0])
              return tuple(values)

          before = os.environ['BEFORE_SHA']
          current = version('HEAD')
          previous = None if not before or set(before) == {'0'} else version(before)
          changed = previous != current
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={str(changed).lower()}\n')
          print(f'Version: {previous} -> {current}; build={changed}')
          PY

  build:
    name: Test and build
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check module handlers and live settings
        run: |
          python3 scripts/check_effects.py
          python3 scripts/check_systemui_restart.py
          python3 scripts/check_live_settings.py
      - name: Test, lint and assemble release APK
        # Full lintRelease includes fatal checks, so assemble does not need a second lint pass.
        run: >-
          ./gradlew --no-daemon
          :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          -x :app:lintVitalRelease
          -x :app:lintVitalReportRelease
          -x :app:lintVitalAnalyzeRelease
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py app/build/outputs/apk/release/output-metadata.json "$RELEASE_TAG"
      - name: Upload unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thunder-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          compression-level: 0 # APKs are already compressed.
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thunder-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          retention-days: 7

  release:
    name: Sign and publish release
    if: github.ref_type == 'tag' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: thunder-unsigned-${{ github.sha }}
          path: unsigned
      - name: Validate APK and tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py unsigned/output-metadata.json "$RELEASE_TAG"
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          UNSIGNED_APK: ${{ steps.version.outputs.apk }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          : "${SIGNING_CERT_SHA256:?Missing ANDROID_SIGNING_CERT_SHA256 repository variable}"
          umask 077
          keystore="$RUNNER_TEMP/thunder-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release
          "$tools/zipalign" -P 16 -f 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "release/$ASSET_NAME" "$RUNNER_TEMP/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "release/$ASSET_NAME"
          "$tools/apksigner" verify --verbose --print-certs "release/$ASSET_NAME" | tee "$RUNNER_TEMP/signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt")
          test "$actual" = "$SIGNING_CERT_SHA256"
          (cd release && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")
      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thunder-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0 # APKs are already compressed.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json" >/dev/null || {
              echo 'A published release already exists; publish a new version instead.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "thunder $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
